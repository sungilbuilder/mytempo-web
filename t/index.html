<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>받은 템포 · mytempo</title>
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121510" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233F6136'/%3E%3Cpath d='M 12.802 2.835 A 9.2 9.2 0 1 1 2.940 13.598' fill='none' stroke='%23F2F5EE' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M 2.800 12.000 A 9.2 9.2 0 0 1 11.198 2.835' fill='none' stroke='%23D9B84A' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<!--
  템포 공유 링크가 여는 페이지 (2026-10-16, 앱 T-113 5단계).
  값은 주소 # 뒤에만 있다(b 백스윙 초 · d 다운스윙 초 · c 클럽 · f fps). # 뒤는 브라우저가 서버로 보내지 않는다.
  receive.js가 값을 읽어 링(랜딩 .ring과 같은 기하, 초록 백스윙 · 금색 다운스윙)에 그리고 「마이템포에서 열기」를
  앱 링크(mytempo://receive?…)로 만든다. 클럽 · 초 수는 쓰지 않는다(창업자 10-19: 받는 사람에겐 비율과 쓰임만).
  검사 규칙은 앱 features/tempo/shareLink.ts parseSharedTempo와 같다.
-->
<nav class="nav">
  <div class="wrap">
        <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M 12.802 2.835 A 9.2 9.2 0 1 1 2.940 13.598" style="stroke:var(--on-primary)" stroke-width="2" stroke-linecap="round"/><path d="M 2.800 12.000 A 9.2 9.2 0 0 1 11.198 2.835" style="stroke:var(--gold)" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-word">mytempo</span>
    </a>
  </div>
</nav>

<main class="wrap tempo-share">
  <h1 id="title">받은 템포</h1>
  <div id="tempo" hidden>
    <div class="ring" id="ring" role="img">
      <svg aria-hidden="true" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="42" fill="none" stroke-width="9"/>
        <circle class="ring-gold" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="264"/>
        <circle class="ring-green" id="arc" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="198 66"/>
      </svg>
      <div class="ring-center"><span><span class="approx" id="approx"></span><span id="ratio"></span></span></div>
    </div>
    <p class="tempo-share-detail" id="what"></p>
    <a class="btn-primary" id="open" href="#">마이템포에서 열기</a>
    <p class="tempo-share-note" id="noapp">앱이 없으면 먼저 받아 주세요. 받은 뒤 이 링크를 다시 열면 돼요.</p>
    <div class="store-row">
      <!-- 스토어 아이콘은 랜딩 .store-badge와 같은 그림, 색은 버튼 글자색을 따른다(창업자 10-21) -->
      <a class="btn-ghost" id="play" href="https://play.google.com/store/apps/details?id=com.mytempo.golf&amp;referrer=utm_source%3Dtempo_share"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 2.2a1 1 0 0 0-.4.8v18a1 1 0 0 0 .4.8l10-9.8-10-9.8Zm11.4 8.5 2.9-2.8-11-6.3 8.1 9.1Zm0 2.6-8.1 9.1 11-6.3-2.9-2.8Zm1.5-1.3 3.6-2a1 1 0 0 0 0-1.8l-3.6-2-2.1 2 2.1 2 2.1 1.8Z"/></svg>Google Play</a>
      <a class="btn-ghost" href="https://apps.apple.com/app/id6818107414"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.9-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7 1.4 0 1.8.7 3 .7 1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6 0 0-2.5-1-2.5-3.6ZM14.1 5.5c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3Z"/></svg>App Store</a>
    </div>
  </div>
  <p class="tempo-share-detail" id="invalid" hidden>링크의 템포를 읽지 못했어요. 보낸 분께 다시 보내 달라고 해 주세요.</p>
</main>

<script src="/t/receive.js"></script>
</body>
</html>
