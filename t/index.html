<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>받은 템포 · mytempo</title>
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D110D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233F6136'/%3E%3Cpath d='M 12.802 2.835 A 9.2 9.2 0 1 1 2.940 13.598' fill='none' stroke='%23F2F5EE' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M 2.800 12.000 A 9.2 9.2 0 0 1 11.198 2.835' fill='none' stroke='%23D9B84A' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<!--
  템포 공유 링크가 여는 페이지 (2026-10-16, 앱 T-113 5단계).
  값은 주소 # 뒤에만 있다(b 백스윙 초 · d 다운스윙 초 · c 클럽 · f fps). # 뒤는 브라우저가 서버로 보내지 않는다.
  receive.js가 값을 읽어 화면에 쓰고 「마이템포에서 열기」를 앱 링크(mytempo://receive?…)로 만든다.
  검사 규칙은 앱 features/tempo/shareLink.ts parseSharedTempo와 같다.
-->
<nav class="nav">
  <div class="wrap">
        <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M 12.802 2.835 A 9.2 9.2 0 1 1 2.940 13.598" style="stroke:var(--on-primary)" stroke-width="2" stroke-linecap="round"/><path d="M 2.800 12.000 A 9.2 9.2 0 0 1 11.198 2.835" style="stroke:var(--gold)" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-word">mytempo</span>
    </a>
  </div>
</nav>

<main class="wrap tempo-share">
  <h1 id="title">받은 템포</h1>
  <div id="tempo" hidden>
    <p class="tempo-share-ratio" id="ratio"></p>
    <p class="tempo-share-detail" id="detail"></p>
    <a class="btn-primary" id="open" href="#">마이템포에서 열기</a>
    <p class="tempo-share-note" id="noapp">앱이 없으면 먼저 받아 주세요. 받은 뒤 이 링크를 다시 열면 돼요.</p>
    <div class="store-row">
      <a class="btn-ghost" id="play" href="https://play.google.com/store/apps/details?id=com.mytempo.golf&amp;referrer=utm_source%3Dtempo_share">Google Play</a>
      <a class="btn-ghost" href="https://apps.apple.com/app/id6818107414">App Store</a>
    </div>
  </div>
  <p class="tempo-share-detail" id="invalid" hidden>링크의 템포를 읽지 못했어요. 보낸 분께 다시 보내 달라고 해 주세요.</p>
</main>

<script src="/t/receive.js"></script>
</body>
</html>
